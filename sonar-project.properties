# ============================================
# SonarCloud Configuration for Angular Project
# ============================================

# Required: Project identification
sonar.projectKey=my-angular-app
sonar.projectName=My Angular App
sonar.projectVersion=1.0.0

# Skip security hotspot analysis (focus on code quality)
sonar.security.hotspots.inheritedRules.activated=false

# Source code location - ONLY scan src folder
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/test.ts,**/environments/**,**/*.scss

# Global exclusions - exclude workflow files from ALL analysis including security
sonar.global.exclusions=**/.github/**,**/*.yml,**/*.yaml

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Test execution report (from karma-sonarqube-reporter)
sonar.testExecutionReportPaths=reports/ut_report.xml

# Code coverage - REQUIRED for Quality Gate to compute
sonar.javascript.lcov.reportPaths=coverage/my-angular-app/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# ============================================
# Quality Gate will PASS when:
# ============================================
# - Coverage on new code >= 80%
# - Duplicated lines on new code <= 3%
# - Maintainability rating = A
# - Reliability rating = A  
# - Security rating = A

# ============================================
# Issue Severity Overrides
# ============================================
# Ignore specific rules
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Ignore empty functions in test files
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts

# Ignore security hotspots for development
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S5131
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e5.ruleKey=Web:S5256
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.html

# Skip waiting for quality gate (optional for CI)
sonar.qualitygate.wait=false

